<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#3b2414">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Bottling Run Tracker</title>
  <style>
:root {
  --bg: #f6f1ea;
  --card: #ffffff;
  --ink: #2a1f17;
  --muted: #7a6a5c;
  --line: #e4d9cc;
  --brand: #3b2414;
  --accent: #b5651d;
  --accent-soft: #fbefe2;
  --auto: #eef5ee;
  --auto-line: #9cc39f;
  --danger: #b3261e;
  --radius: 12px;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-size: 16px;
  line-height: 1.4;
}

/* ---------- Top bar ---------- */
.topbar {
  position: sticky;
  top: 0;
  z-index: 10;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 12px 16px;
  padding-top: max(12px, env(safe-area-inset-top));
  background: var(--brand);
  color: #fff;
}
.topbar h1 { margin: 0; font-size: 1.1rem; font-weight: 650; }
.topbar-actions { display: flex; gap: 8px; align-items: center; }

/* ---------- Buttons ---------- */
.btn {
  appearance: none;
  border: 1px solid var(--line);
  background: #fff;
  color: var(--ink);
  border-radius: 999px;
  padding: 8px 14px;
  font: inherit;
  font-size: 0.95rem;
  font-weight: 600;
  cursor: pointer;
  list-style: none;
}
.btn::-webkit-details-marker { display: none; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.topbar .btn:not(.primary) { background: transparent; color: #fff; border-color: rgba(255,255,255,0.35); }

.link-btn {
  appearance: none;
  border: none;
  background: none;
  padding: 0;
  font: inherit;
  font-size: 0.8rem;
  color: var(--accent);
  text-decoration: underline;
  cursor: pointer;
}
.danger-link { color: var(--danger); }

/* ---------- Menu ---------- */
.menu { position: relative; }
.menu-list {
  position: absolute;
  right: 0;
  top: calc(100% + 6px);
  min-width: 200px;
  background: #fff;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  box-shadow: 0 8px 24px rgba(0,0,0,0.15);
  overflow: hidden;
}
.menu-list button {
  display: block;
  width: 100%;
  text-align: left;
  padding: 12px 16px;
  border: none;
  background: none;
  font: inherit;
  color: var(--ink);
  cursor: pointer;
}
.menu-list button + button { border-top: 1px solid var(--line); }
.menu-list button:hover { background: var(--accent-soft); }

/* ---------- Layout ---------- */
main { max-width: 900px; margin: 0 auto; padding: 12px 12px 24px; }
.empty { text-align: center; color: var(--muted); padding: 48px 16px; }
.footer { text-align: center; color: var(--muted); font-size: 0.8rem; padding: 0 16px 32px; }

/* ---------- Day ---------- */
.day {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  margin-bottom: 12px;
  overflow: hidden;
}
.day-head {
  display: grid;
  grid-template-columns: 1fr auto;
  grid-template-areas: "date chev" "sum chev";
  align-items: center;
  width: 100%;
  padding: 14px 16px;
  border: none;
  background: none;
  font: inherit;
  color: inherit;
  text-align: left;
  cursor: pointer;
}
.day-date { grid-area: date; font-weight: 700; font-size: 1.05rem; }
.day-sum { grid-area: sum; color: var(--muted); font-size: 0.85rem; }
.chev { grid-area: chev; font-size: 1.2rem; color: var(--muted); transition: transform 0.15s; }
.day.open .chev { transform: rotate(180deg); }
.day.open .day-head { border-bottom: 1px solid var(--line); background: var(--accent-soft); }
.badge {
  display: inline-block;
  margin-left: 8px;
  padding: 1px 8px;
  border-radius: 999px;
  background: var(--accent);
  color: #fff;
  font-size: 0.72rem;
  font-weight: 700;
  vertical-align: middle;
}

.day-body { padding: 12px; display: grid; gap: 12px; }

.panel, .run {
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 12px;
}
.panel h3, .run h3 { margin: 0 0 8px; font-size: 1rem; }
.day-info { background: #fcfaf7; }

.day-actions {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  flex-wrap: wrap;
}

/* ---------- Run ---------- */
.run-head { display: flex; align-items: center; gap: 10px; margin-bottom: 4px; }
.run-head h3 { margin: 0; white-space: nowrap; }
.run-name {
  flex: 1;
  min-width: 0;
  border: none;
  border-bottom: 1px dashed var(--line);
  background: transparent;
  font: inherit;
  font-size: 0.95rem;
  padding: 4px 2px;
  color: var(--ink);
}
.run-name:focus { outline: none; border-bottom-color: var(--accent); }
.icon-btn {
  appearance: none;
  border: none;
  background: none;
  color: var(--muted);
  font-size: 1.1rem;
  padding: 4px 8px;
  cursor: pointer;
}
.icon-btn:hover { color: var(--danger); }

.sec {
  border: none;
  border-top: 1px solid var(--line);
  margin: 10px 0 0;
  padding: 10px 0 0;
}
.sec legend {
  padding: 0 6px 0 0;
  font-size: 0.75rem;
  font-weight: 700;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--accent);
}

/* ---------- Fields ---------- */
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
  gap: 10px 12px;
}
.field { display: flex; flex-direction: column; gap: 4px; }
.field > span { font-size: 0.8rem; color: var(--muted); font-weight: 600; }
.field input, .field output {
  width: 100%;
  padding: 10px;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: #fff;
  font: inherit;
  color: var(--ink);
  min-height: 44px;
}
.field input:focus { outline: 2px solid var(--accent); outline-offset: -1px; border-color: var(--accent); }
.field input.invalid { border-color: var(--danger); background: #fdf0ef; }
.field input.auto, .field output { background: var(--auto); border-color: var(--auto-line); }
.field output { display: flex; align-items: center; font-weight: 600; }
.hint { font-size: 0.75rem; color: var(--muted); margin: 0; }
.hint .link-btn { margin-left: 4px; }

/* ---------- Dialog ---------- */
dialog {
  border: none;
  border-radius: var(--radius);
  padding: 20px;
  width: min(360px, calc(100vw - 32px));
  box-shadow: 0 16px 40px rgba(0,0,0,0.25);
}
dialog::backdrop { background: rgba(30,20,10,0.45); }
dialog h2 { margin: 0 0 12px; font-size: 1.1rem; }
dialog .hint { min-height: 1.2em; margin-top: 8px; }
.dialog-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; }

@media print {
  .topbar-actions, .day-actions, .icon-btn, .footer, .link-btn { display: none !important; }
  .topbar { position: static; background: none; color: #000; }
}
  </style>
</head>
<body>
  <header class="topbar">
    <h1>Bottling Run Tracker</h1>
    <div class="topbar-actions">
      <button id="newDayBtn" class="btn primary" type="button">+ New day</button>
      <details class="menu" id="menu">
        <summary class="btn" aria-label="More options">&#8943;</summary>
        <div class="menu-list">
          <button type="button" data-menu="export-csv">Export CSV</button>
          <button type="button" data-menu="backup">Download backup</button>
          <button type="button" data-menu="restore">Restore from backup</button>
        </div>
      </details>
    </div>
  </header>

  <main id="days"></main>
  <p id="empty" class="empty" hidden>No days yet. Tap <strong>+ New day</strong> to start.</p>

  <footer class="footer">Changes save automatically on this device. Download a backup now and then.</footer>

  <dialog id="newDayDialog">
    <form method="dialog">
      <h2>New day</h2>
      <label class="field">
        <span>Date</span>
        <input type="date" id="newDayDate" required>
      </label>
      <p class="hint" id="newDayHint"></p>
      <div class="dialog-actions">
        <button class="btn" value="cancel" formnovalidate>Cancel</button>
        <button class="btn primary" value="ok">Add day</button>
      </div>
    </form>
  </dialog>

  <input type="file" id="restoreInput" accept="application/json,.json" hidden>

  <script>
/* Bottling Run Tracker
 * Tracks daily bottling runs for a bottle-your-own program.
 * All data is stored in the browser's localStorage. Use Backup / Restore to move it.
 */
(() => {
  'use strict';

  const STORAGE_KEY = 'bottling-run-tracker:v1';
  const DEFAULT_RUNS = 3;
  const MAX_RUNS = 5;

  // Fields that apply to the whole day.
  const DAY_FIELDS = [
    { key: 'salesOrder', label: 'Sales order #', mode: 'numeric' },
    { key: 'obd', label: 'OBD #', mode: 'numeric' },
    { key: 'batch', label: 'Batch #', mode: 'text' },
  ];

  // Fields tracked for each bottle run, grouped into sections.
  // kind: number | integer | text | startProof (auto-filled) | abv (calculated)
  const SECTIONS = [
    {
      title: 'Opening the Room',
      fields: [
        { key: 'startProof', label: 'Starting proof', kind: 'startProof' },
        { key: 'startSightGlass', label: 'Starting sight glass reading', kind: 'number' },
        { key: 'fullVolume', label: 'Full volume', kind: 'number' },
        { key: 'bottleProof', label: "Today's bottle proof", kind: 'number' },
        { key: 'abv', label: "Today's bottle ABV", kind: 'abv' },
      ],
    },
    {
      title: 'Closing the Room',
      fields: [
        { key: 'bottlesFilled', label: 'Bottles filled', kind: 'integer' },
        { key: 'endSightGlass', label: 'Sight glass reading', kind: 'number' },
        { key: 'endProof', label: 'Ending proof', kind: 'number' },
      ],
    },
    {
      title: 'Info',
      fields: [
        { key: 'endProofGallons', label: 'Ending proof gallons', kind: 'number' },
        { key: 'bottlesRemaining', label: 'Bottles remaining', kind: 'integer' },
      ],
    },
    {
      title: 'SAP',
      fields: [{ key: 'processOrder', label: 'Process order #', kind: 'text', mode: 'numeric' }],
    },
  ];

  const ENTRY_KEYS = SECTIONS.flatMap(s => s.fields)
    .filter(f => f.kind !== 'startProof' && f.kind !== 'abv')
    .map(f => f.key);

  // ---------- Helpers ----------
  const $ = sel => document.querySelector(sel);
  const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  const pad = n => String(n).padStart(2, '0');
  const esc = v => String(v ?? '').replace(/[&<>"']/g, c => (
    { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  function todayISO() {
    const d = new Date();
    return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  }
  function parseISO(iso) {
    const [y, m, d] = iso.split('-').map(Number);
    return new Date(y, m - 1, d);
  }
  function fmtLong(iso) {
    return parseISO(iso).toLocaleDateString(undefined, {
      weekday: 'short', month: 'short', day: 'numeric', year: 'numeric',
    });
  }
  function fmtShort(iso) {
    return parseISO(iso).toLocaleDateString(undefined, { weekday: 'short', month: 'numeric', day: 'numeric' });
  }
  const isBlank = v => v === null || v === undefined || String(v).trim() === '';
  const NUM_RE = /^-?(\d+\.?\d*|\.\d+)$/;
  const INT_RE = /^\d+$/;
  const fmtNum = n => String(Number(n.toFixed(2)));

  // ---------- State ----------
  function newRun(name = '') {
    const run = { id: uid(), name, startProofOverride: null };
    ENTRY_KEYS.forEach(k => { run[k] = ''; });
    return run;
  }

  function normalize(data) {
    const days = Array.isArray(data && data.days) ? data.days : [];
    return {
      version: 1,
      days: days
        .filter(d => d && /^\d{4}-\d{2}-\d{2}$/.test(d.date))
        .map(d => ({
          id: d.id || uid(),
          date: d.date,
          salesOrder: d.salesOrder ?? '',
          obd: d.obd ?? '',
          batch: d.batch ?? '',
          runs: (Array.isArray(d.runs) && d.runs.length ? d.runs : [newRun()])
            .slice(0, MAX_RUNS)
            .map(r => Object.assign(newRun(), r, { id: r.id || uid() })),
        })),
    };
  }

  function load() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) return normalize(JSON.parse(raw));
    } catch (e) { /* fall through to empty state */ }
    return { version: 1, days: [] };
  }

  let saveFailedWarned = false;
  function save() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    } catch (e) {
      if (!saveFailedWarned) {
        saveFailedWarned = true;
        alert('Could not save to this browser. Download a backup so you don’t lose your entries.');
      }
    }
  }

  let state = load();
  const expanded = new Set();

  const getDay = id => state.days.find(d => d.id === id);
  const sortedDays = () => [...state.days].sort((a, b) => b.date.localeCompare(a.date));

  // The most recent day before this one (not necessarily the calendar day before).
  function priorDay(day) {
    let best = null;
    for (const d of state.days) {
      if (d.date < day.date && (!best || d.date > best.date)) best = d;
    }
    return best;
  }

  // Starting proof = prior day's ending proof for the same run number, unless typed in manually.
  function startProofFor(day, i) {
    const run = day.runs[i];
    if (!isBlank(run.startProofOverride)) return { value: run.startProofOverride, source: 'manual' };
    const prev = priorDay(day);
    const prevRun = prev && prev.runs[i];
    if (prevRun && !isBlank(prevRun.endProof)) return { value: prevRun.endProof, source: 'auto', from: prev.date };
    return { value: '', source: 'none', from: prev ? prev.date : null };
  }

  function startProofHint(day, i, sp) {
    if (sp.source === 'auto') return `From ${fmtShort(sp.from)} · Run ${i + 1} ending proof`;
    if (sp.source === 'manual') {
      return `Entered manually <button type="button" class="link-btn" data-action="reset-start"
        data-day="${day.id}" data-run="${i}">Use prior day</button>`;
    }
    if (sp.from) return `No ending proof for Run ${i + 1} on ${fmtShort(sp.from)} yet`;
    return 'No prior day. Enter it manually';
  }

  function abvFor(run) {
    const p = String(run.bottleProof).trim();
    return NUM_RE.test(p) ? fmtNum(parseFloat(p) / 2) : '';
  }

  function bottlesFilledTotal(day) {
    return day.runs.reduce((sum, r) => sum + (INT_RE.test(String(r.bottlesFilled).trim()) ? +r.bottlesFilled : 0), 0);
  }
  function daySummary(day) {
    const n = day.runs.length;
    const parts = [`${n} run${n === 1 ? '' : 's'}`, `${bottlesFilledTotal(day)} bottles filled`];
    if (!isBlank(day.salesOrder)) parts.push(`SO ${day.salesOrder}`);
    return parts.join(' · ');
  }

  // ---------- Rendering ----------
  const container = $('#days');

  function render() {
    const days = sortedDays();
    $('#empty').hidden = days.length > 0;
    container.innerHTML = days.map(renderDay).join('');
    container.querySelectorAll('input[data-field]').forEach(validate);
  }

  function renderDay(day) {
    const open = expanded.has(day.id);
    const today = day.date === todayISO();
    return `
      <section class="day ${open ? 'open' : ''}" data-day-id="${day.id}">
        <button type="button" class="day-head" data-action="toggle" data-day="${day.id}" aria-expanded="${open}">
          <span class="day-date">${esc(fmtLong(day.date))}${today ? '<span class="badge">Today</span>' : ''}</span>
          <span class="day-sum" data-sum="${day.id}">${esc(daySummary(day))}</span>
          <span class="chev" aria-hidden="true">&#9662;</span>
        </button>
        ${open ? renderDayBody(day) : ''}
      </section>`;
  }

  function renderDayBody(day) {
    const n = day.runs.length;
    return `
      <div class="day-body">
        <div class="panel day-info">
          <h3>Day info</h3>
          <div class="grid">
            <label class="field">
              <span>Date</span>
              <input type="date" data-day="${day.id}" data-field="date" value="${esc(day.date)}">
            </label>
            ${DAY_FIELDS.map(f => `
              <label class="field">
                <span>${f.label}</span>
                <input type="text" inputmode="${f.mode}" autocomplete="off"
                  data-day="${day.id}" data-field="${f.key}" value="${esc(day[f.key])}">
              </label>`).join('')}
          </div>
        </div>
        ${day.runs.map((r, i) => renderRun(day, r, i)).join('')}
        <div class="day-actions">
          <button type="button" class="btn" data-action="add-run" data-day="${day.id}" ${n >= MAX_RUNS ? 'disabled' : ''}>
            + Add run (${n}/${MAX_RUNS})
          </button>
          <button type="button" class="link-btn danger-link" data-action="delete-day" data-day="${day.id}">Delete this day</button>
        </div>
      </div>`;
  }

  function renderRun(day, run, i) {
    return `
      <article class="run">
        <div class="run-head">
          <h3>Run ${i + 1}</h3>
          <input class="run-name" type="text" placeholder="Product / tank (optional)" autocomplete="off"
            data-day="${day.id}" data-run="${i}" data-field="name" value="${esc(run.name)}">
          ${day.runs.length > 1 ? `<button type="button" class="icon-btn" aria-label="Remove run ${i + 1}"
            data-action="remove-run" data-day="${day.id}" data-run="${i}">&#10005;</button>` : ''}
        </div>
        ${SECTIONS.map(sec => `
          <fieldset class="sec">
            <legend>${sec.title}</legend>
            <div class="grid">${sec.fields.map(f => renderField(day, run, i, f)).join('')}</div>
          </fieldset>`).join('')}
      </article>`;
  }

  function renderField(day, run, i, f) {
    const attrs = `data-day="${day.id}" data-run="${i}"`;
    if (f.kind === 'startProof') {
      const sp = startProofFor(day, i);
      return `
        <label class="field">
          <span>${f.label}</span>
          <input type="text" inputmode="decimal" autocomplete="off" ${attrs} data-field="startProofOverride"
            data-kind="number" class="${sp.source === 'auto' ? 'auto' : ''}" value="${esc(sp.value)}">
          <small class="hint" data-hint="${day.id}:${i}">${startProofHint(day, i, sp)}</small>
        </label>`;
    }
    if (f.kind === 'abv') {
      const abv = abvFor(run);
      return `
        <div class="field">
          <span>${f.label}</span>
          <output data-abv="${day.id}:${i}">${abv ? abv + '%' : '—'}</output>
          <small class="hint">Bottle proof ÷ 2</small>
        </div>`;
    }
    const mode = f.mode || (f.kind === 'integer' ? 'numeric' : f.kind === 'number' ? 'decimal' : 'text');
    return `
      <label class="field">
        <span>${f.label}</span>
        <input type="text" inputmode="${mode}" autocomplete="off" ${attrs}
          data-field="${f.key}" data-kind="${f.kind}" value="${esc(run[f.key])}">
      </label>`;
  }

  function validate(el) {
    const v = el.value.trim();
    const kind = el.dataset.kind;
    let ok = true;
    if (v && kind === 'number') ok = NUM_RE.test(v);
    if (v && kind === 'integer') ok = INT_RE.test(v);
    el.classList.toggle('invalid', !ok);
  }

  // Update calculated values in place so typing never loses focus.
  function refreshDerived() {
    const active = document.activeElement;
    for (const day of state.days) {
      const sum = container.querySelector(`[data-sum="${day.id}"]`);
      if (sum) sum.textContent = daySummary(day);
      day.runs.forEach((run, i) => {
        const out = container.querySelector(`[data-abv="${day.id}:${i}"]`);
        if (!out) return;
        const abv = abvFor(run);
        out.textContent = abv ? abv + '%' : '—';

        const sp = startProofFor(day, i);
        const input = container.querySelector(`input[data-day="${day.id}"][data-run="${i}"][data-field="startProofOverride"]`);
        if (input && input !== active) {
          input.value = sp.value;
          input.classList.toggle('auto', sp.source === 'auto');
          validate(input);
        }
        const hint = container.querySelector(`[data-hint="${day.id}:${i}"]`);
        if (hint) hint.innerHTML = startProofHint(day, i, sp);
      });
    }
  }

  // ---------- Events ----------
  container.addEventListener('input', e => {
    const el = e.target;
    const field = el.dataset.field;
    if (!field || field === 'date') return;
    const day = getDay(el.dataset.day);
    if (!day) return;
    if (el.dataset.run !== undefined) {
      const run = day.runs[+el.dataset.run];
      if (field === 'startProofOverride') {
        run.startProofOverride = isBlank(el.value) ? null : el.value.trim();
        el.classList.remove('auto');
      } else {
        run[field] = el.value;
      }
    } else {
      day[field] = el.value;
    }
    validate(el);
    save();
    refreshDerived();
  });

  container.addEventListener('focusout', () => setTimeout(refreshDerived, 0));

  container.addEventListener('change', e => {
    const el = e.target;
    if (el.dataset.field !== 'date') return;
    const day = getDay(el.dataset.day);
    const next = el.value;
    if (!day || !next || next === day.date) { if (day) el.value = day.date; return; }
    if (state.days.some(d => d.id !== day.id && d.date === next)) {
      alert(`There is already an entry for ${fmtLong(next)}.`);
      el.value = day.date;
      return;
    }
    day.date = next;
    save();
    render();
  });

  container.addEventListener('click', e => {
    const btn = e.target.closest('[data-action]');
    if (!btn) return;
    const day = getDay(btn.dataset.day);
    if (!day) return;
    const i = btn.dataset.run !== undefined ? +btn.dataset.run : null;

    switch (btn.dataset.action) {
      case 'toggle':
        expanded.has(day.id) ? expanded.delete(day.id) : expanded.add(day.id);
        render();
        break;

      case 'add-run': {
        if (day.runs.length >= MAX_RUNS) return;
        const prev = priorDay(day);
        const prevRun = prev && prev.runs[day.runs.length];
        day.runs.push(newRun(prevRun ? prevRun.name : ''));
        save();
        render();
        break;
      }

      case 'remove-run': {
        const run = day.runs[i];
        const hasData = ENTRY_KEYS.some(k => !isBlank(run[k])) || !isBlank(run.startProofOverride);
        if (hasData && !confirm(`Remove Run ${i + 1}? Everything entered for it will be deleted.`)) return;
        day.runs.splice(i, 1);
        save();
        render();
        break;
      }

      case 'reset-start':
        day.runs[i].startProofOverride = null;
        save();
        refreshDerived();
        break;

      case 'delete-day':
        if (!confirm(`Delete ${fmtLong(day.date)} and all of its runs? This can’t be undone.`)) return;
        state.days = state.days.filter(d => d.id !== day.id);
        expanded.delete(day.id);
        save();
        render();
        break;
    }
  });

  // ---------- New day ----------
  const dialog = $('#newDayDialog');
  const dateInput = $('#newDayDate');
  const dateHint = $('#newDayHint');

  function updateNewDayHint() {
    const exists = state.days.some(d => d.date === dateInput.value);
    dateHint.textContent = exists ? 'That date already exists. Adding will open it.' : '';
  }

  $('#newDayBtn').addEventListener('click', () => {
    dateInput.value = todayISO();
    updateNewDayHint();
    if (typeof dialog.showModal === 'function') {
      dialog.showModal();
    } else {
      const d = prompt('Date (YYYY-MM-DD)', todayISO());
      if (d) createDay(d);
    }
  });
  dateInput.addEventListener('input', updateNewDayHint);
  dialog.addEventListener('close', () => {
    if (dialog.returnValue === 'ok' && dateInput.value) createDay(dateInput.value);
  });

  function createDay(date) {
    if (!/^\d{4}-\d{2}-\d{2}$/.test(date)) return;
    let day = state.days.find(d => d.date === date);
    if (!day) {
      const tmp = { date };
      const prev = priorDay(tmp);
      const count = prev ? Math.max(DEFAULT_RUNS, prev.runs.length) : DEFAULT_RUNS;
      day = {
        id: uid(),
        date,
        salesOrder: '',
        obd: '',
        batch: '',
        runs: Array.from({ length: Math.min(count, MAX_RUNS) }, (_, i) =>
          newRun(prev && prev.runs[i] ? prev.runs[i].name : '')),
      };
      state.days.push(day);
      save();
    }
    expanded.add(day.id);
    render();
    const el = container.querySelector(`[data-day-id="${day.id}"]`);
    if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  // ---------- Export / backup / restore ----------
  function download(filename, text, type) {
    const blob = new Blob([text], { type });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  }

  function exportCSV() {
    const headers = [
      'Date', 'Sales order #', 'OBD #', 'Batch #', 'Run', 'Run name',
      'Starting proof', 'Starting sight glass reading', 'Full volume', "Today's bottle proof", "Today's bottle ABV",
      'Bottles filled', 'Sight glass reading', 'Ending proof',
      'Ending proof gallons', 'Bottles remaining',
      'Process order #',
    ];
    const cell = v => {
      const s = String(v ?? '');
      return /[",\n\r]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s;
    };
    const rows = [headers];
    for (const day of sortedDays()) {
      day.runs.forEach((r, i) => {
        rows.push([
          day.date, day.salesOrder, day.obd, day.batch, i + 1, r.name,
          startProofFor(day, i).value, r.startSightGlass, r.fullVolume, r.bottleProof, abvFor(r),
          r.bottlesFilled, r.endSightGlass, r.endProof,
          r.endProofGallons, r.bottlesRemaining,
          r.processOrder,
        ]);
      });
    }
    download(`bottling-runs-${todayISO()}.csv`, rows.map(r => r.map(cell).join(',')).join('\r\n'), 'text/csv');
  }

  function backup() {
    download(`bottling-runs-backup-${todayISO()}.json`, JSON.stringify(state, null, 2), 'application/json');
  }

  const restoreInput = $('#restoreInput');
  restoreInput.addEventListener('change', () => {
    const file = restoreInput.files && restoreInput.files[0];
    restoreInput.value = '';
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const data = normalize(JSON.parse(reader.result));
        if (!confirm(`Replace everything here with the ${data.days.length} day(s) in this backup?`)) return;
        state = data;
        expanded.clear();
        const newest = sortedDays()[0];
        if (newest) expanded.add(newest.id);
        save();
        render();
      } catch (e) {
        alert('That file isn’t a valid backup.');
      }
    };
    reader.readAsText(file);
  });

  const menu = $('#menu');
  menu.addEventListener('click', e => {
    const btn = e.target.closest('[data-menu]');
    if (!btn) return;
    menu.open = false;
    if (btn.dataset.menu === 'export-csv') exportCSV();
    if (btn.dataset.menu === 'backup') backup();
    if (btn.dataset.menu === 'restore') restoreInput.click();
  });
  document.addEventListener('click', e => {
    if (menu.open && !menu.contains(e.target)) menu.open = false;
  });

  // ---------- Start ----------
  const newest = sortedDays()[0];
  if (newest) expanded.add(newest.id);
  render();
})();
  </script>
</body>
</html>
